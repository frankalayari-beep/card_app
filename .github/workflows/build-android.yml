name: Build Android APK & PlayStore AAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK 34
        run: |
          SDKMGR=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -n 1)
          yes | $SDKMGR --licenses > /dev/null 2>&1 || true
          $SDKMGR "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Signed APK & AAB
        run: |
          npm install -g cordova
          cordova create app com.cardiq.pro "CardIQ Pro"
          cp index.html app/www/index.html

          if [ -f icon.png ]; then
            cp icon.png app/icon.png
            sed -i 's/<\/widget>/<icon src="icon.png" \/><\/widget>/' app/config.xml
          fi

          cd app
          sed -i 's/<\/widget>/<allow-navigation href="*"\/><access origin="*"\/><preference name="Orientation" value="portrait"\/><\/widget>/' config.xml
          cordova platform add android@13.0.0

          keytool -genkeypair -v -keystore key.keystore -alias cardiq -keyalg RSA -keysize 2048 -validity 10000 -storepass CardIQ2026 -keypass CardIQ2026 -dname "CN=CardIQ, O=CardIQ, C=GB"

          cat << 'EOF' > build-apk.json
          {
            "android": {
              "release": {
                "keystore": "key.keystore",
                "storePassword": "CardIQ2026",
                "alias": "cardiq",
                "password": "CardIQ2026",
                "packageType": "apk"
              }
            }
          }
          EOF

          cat << 'EOF' > build-aab.json
          {
            "android": {
              "release": {
                "keystore": "key.keystore",
                "storePassword": "CardIQ2026",
                "alias": "cardiq",
                "password": "CardIQ2026",
                "packageType": "bundle"
              }
            }
          }
          EOF

          cordova build android --release --buildConfig=build-apk.json
          cordova build android --release --buildConfig=build-aab.json

          cp platforms/android/app/build/outputs/apk/release/app-release.apk ../CardIQ-Pro.apk
          cp platforms/android/app/build/outputs/bundle/release/app-release.aab ../CardIQ-Pro-PlayStore.aab

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "CardIQ Pro Android App (v1.0.${{ github.run_number }})"
          files: |
            CardIQ-Pro.apk
            CardIQ-Pro-PlayStore.aab
