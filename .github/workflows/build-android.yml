name: Build Android APK & PlayStore AAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build Signed APK & AAB
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          npm install -g cordova
          cordova create app com.cardiq.pro "CardIQ Pro"
          cp index.html app/www/index.html
          cd app
          cordova platform add android@13.0.0
          sed -i 's/<\/widget>/<allow-navigation href="*"\/><access origin="*"\/><preference name="Orientation" value="portrait"\/><\/widget>/' config.xml
          keytool -genkeypair -v -keystore key.keystore -alias cardiq -keyalg RSA -keysize 2048 -validity 10000 -storepass CardIQ2026 -keypass CardIQ2026 -dname "CN=CardIQ, O=CardIQ, C=GB"
          cordova build android --release -- --keystore=key.keystore --storePassword=CardIQ2026 --password=CardIQ2026 --alias=cardiq --packageType=apk
          cordova build android --release -- --keystore=key.keystore --storePassword=CardIQ2026 --password=CardIQ2026 --alias=cardiq --packageType=bundle
          cp platforms/android/app/build/outputs/apk/release/app-release.apk ../CardIQ-Pro.apk
          cp platforms/android/app/build/outputs/bundle/release/app-release.aab ../CardIQ-Pro-PlayStore.aab

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "CardIQ Pro Android App (v1.0.${{ github.run_number }})"
          files: |
            CardIQ-Pro.apk
            CardIQ-Pro-PlayStore.aab
